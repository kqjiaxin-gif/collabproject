function setAuthError(msg){let el=document.getElementById('authError');if(!msg){el.style.display='none';el.textContent='';return}el.style.display='block';el.textContent=msg}
function toggleAuthMode(){
 authMode=authMode=='signin'?'signup':'signin';

async function handleAuthSubmit(e){
 e.preventDefault();setAuthError('');
 if(!sb)return setAuthError("Couldn't reach the authentication service. Check your connection and reload the page.");
 let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;
 let btn=document.getElementById('authSubmitBtn');btn.disabled=true;let originalLabel=btn.textContent;btn.textContent='Please wait…';
 try{
  if(authMode=='signin'){
   let{error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error;
   await onAuthReady();
  }else{
   let fullName=document.getElementById('authName').value.trim();
   let{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:fullName}}});
   if(error)throw error;
   if(data.session){await onAuthReady()}
   else{setAuthError('');document.getElementById('authForm').style.display='none';document.getElementById('authSubtitle').innerHTML='<span class="auth-note" style="display:block">Check your email to confirm your account, then come back and sign in.</span>'}
  }
 }catch(err){setAuthError(err.message||'Something went wrong. Please try again.')}
 btn.disabled=false;btn.textContent=originalLabel;
}
async function onAuthReady(){
 if(!sb)return;
 let{data:{user}}=await sb.auth.getUser();
 if(!user)return;
 authUser=user;
 let{data:profile}=await sb.from('profiles').select('*').eq('id',user.id).single();
 authProfile=profile;
 currentUser=profile?.full_name||user.email;
 currentRole=profile?.role||'Viewer';

 document.getElementById('rolePreview').value=currentRole;
 document.getElementById('authGate').style.display='none';
 document.getElementById('appShell').style.display='';
 setAccessVisibility();render();
}

const TODAY=new Date('2026-08-05T09:00:00');
function iso(d){return d instanceof Date? d.toISOString().slice(0,10): d}
function fmtDate(s){if(!s)return'Not set';let d=new Date(s+'T00:00:00');if(isNaN(d))return s;return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtShort(s){let d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function initials(n){return String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
let idCounters={};
function uid(prefix){idCounters[prefix]=(idCounters[prefix]||0)+1;return `${prefix}-${String(idCounters[prefix]).padStart(3,'0')}`}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function linkify(t){return esc(t).replace(/@(\w+)/g,'<span class="mention">@$1</span>')}

function isOverdue(it){return it.dueDate&&it.status!='Completed'&&new Date(it.dueDate+'T00:00:00')<TODAY}
function isDueSoon(it,days=3){if(!it.dueDate||it.status=='Completed')return false;let d=daysBetween(iso(TODAY),it.dueDate);return d>=0&&d<=days}
function isBlocked(it){return it.status=='Blocked'||it.blockers.length>0}
function projectByName(n){return projects.find(p=>p.name==n)}
function itemsForProject(p){return items.filter(t=>t.linkedProjects.includes(p.name))}
function canSeeProject(p){if(!p.confidential)return true;return currentRole=='Administrator'||currentRole=='Project Manager'||currentRole=='Contributor'}
function canEdit(t){if(!t)return currentRole=='Administrator'||currentRole=='Project Manager';if(currentRole=='Administrator'||currentRole=='Project Manager')return true;if(currentRole=='Contributor')return t.assignee==currentUser||t.createdBy==currentUser||true;return false}

function computeHealth(p){
 let end=new Date(p.plannedEnd+'T00:00:00');
 let overdueMilestone=p.milestones.some(m=>!m.done&&new Date(m.due+'T00:00:00')<TODAY);
 let prev=p.health;
 if(p.health=='On Hold'){}
 else if(p.progress>=100){p.health='On Track'}
 else if(TODAY>end){p.health='Delayed'}
 else if(overdueMilestone){p.health='At Risk'}
 else if(p.health!='On Hold'){p.health=p.health=='Delayed'||p.health=='At Risk'?p.health:'On Track'}
 if(prev!=p.health)logActivity(`Automation flagged ${p.name} as ${p.health}`,'Automation')
}
function syncProgress(){
 items.forEach(t=>{if(t.status=='Completed'){t.progress=100;if(!t.actualCompletion)t.actualCompletion=iso(TODAY)}});
 projects.forEach(p=>{let own=itemsForProject(p).filter(t=>t.type=='Project-Specific');if(own.length)p.progress=Math.round(own.reduce((s,t)=>s+Number(t.progress),0)/own.length);computeHealth(p)});
}

function clearFilters(){filterState={project:'All projects',type:'All types',status:'All status',priority:'All priority',assignee:'All people',team:'All teams',health:'All health',dateFrom:'',dateTo:'',tag:'',overdueOnly:false,blockedOnly:false,search:''};renderCurrentPage()}
function getSavedFilters(){try{return JSON.parse(localStorage.getItem('pcc_saved_filters')||'[]')}catch(e){return[]}}
function saveCurrentFilter(){let name=prompt('Name this view');if(!name)return;let list=getSavedFilters();list.push({name,state:{...filterState}});localStorage.setItem('pcc_saved_filters',JSON.stringify(list));toast(`Saved view "${name}"`);renderCurrentPage()}
function loadSavedFilter(name){if(!name)return;let f=getSavedFilters().find(x=>x.name==name);if(!f)return;filterState={...filterState,...f.state};renderCurrentPage()}

function matchesFilter(t){
 let team=projectByName(t.linkedProjects[0])?.team;
 if(filterState.search&&!(t.id+' '+t.title+' '+t.assignee+' '+t.tags.join(' ')).toLowerCase().includes(filterState.search.toLowerCase()))return false;
 if(filterState.project!='All projects'&&!t.linkedProjects.includes(filterState.project))return false;
 if(filterState.type!='All types'&&t.type!=filterState.type)return false;
 if(filterState.status!='All status'&&t.status!=filterState.status)return false;
 if(filterState.priority!='All priority'&&t.priority!=filterState.priority)return false;
 if(filterState.assignee!='All people'&&t.assignee!=filterState.assignee)return false;
 if(filterState.team!='All teams'&&team!=filterState.team)return false;
 if(filterState.overdueOnly&&!isOverdue(t))return false;
 if(filterState.blockedOnly&&!isBlocked(t))return false;
 return true;
}
function filteredItems(){return items.filter(t=>t.linkedProjects.every(pn=>{let p=projectByName(pn);return !p||canSeeProject(p)})).filter(matchesFilter)}

  <div class="chartcard"><h3>Workload by assignee</h3><p class="sub">Open (non-completed) items per person</p>${workload.map(b=>hbar(b.label,b.count,maxWorkload,'#2B2B2C')).join('')||'<div class="empty">No data</div>'}</div>
  <div class="chartcard"><h3>Planned vs. actual completion</h3><p class="sub">Expected progress (time elapsed) vs. actual</p><div class="legend-row"><span><i style="background:#d8d8d8"></i>Expected</span><span><i style="background:#2B2B2C"></i>Actual</span></div>${plannedVsActual.map(b=>`<div class="hbar-row"><span>${esc(b.label)}</span><div class="hbar-track" style="position:relative"><div class="hbar-fill b" style="width:${b.expected}%"></div><div class="hbar-fill" style="width:${b.actual}%;position:absolute;top:0;left:0;opacity:.85"></div></div><span>${b.actual}%</span></div>`).join('')}</div>
 </div>

 </div>`;

function exportCSV(){

 let blob=new Blob([lines.join('\n')],{type:'text/csv'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='work-items.csv';a.click();

}
function importCSV(e){
 let file=e.target.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=()=>{
  let lines=String(reader.result).split(/\r?\n/).filter(Boolean);
  let header=lines.shift().split(',').map(h=>h.trim().toLowerCase());
  let added=0;
  lines.forEach(line=>{
   let cols=line.split(',');let row={};header.forEach((h,i)=>row[h]=(cols[i]||'').replace(/^"|"$/g,'').trim());
   if(!row.title)return;
   items.push({id:uid('IMP'),title:row.title,description:'',type:row.type||'Project-Specific',linkedProjects:row.project?[row.project]:[],assignee:row.assignee||'Unassigned',status:row.status||'Backlog',priority:row.priority||'Medium',startDate:'',dueDate:row.due||'',actualCompletion:'',progress:0,estEffort:0,actualEffort:0,dependencies:[],blockers:[],tags:['Imported'],attachments:[],comments:[],subtasks:[],approvalStatus:'Pending',createdBy:currentUser,createdAt:iso(TODAY),updatedAt:iso(TODAY)});
   added++;
  });
  logActivity(`Imported ${added} work item(s) from CSV`,'Work items');
  toast(`Imported ${added} work item(s)`);
  render();
 };
 reader.readAsText(file);e.target.value='';
}

 ${visible.map(p=>{
  let left=daysBetween(minD,p.plannedStart)/total*100,width=Math.max(2,daysBetween(p.plannedStart,p.plannedEnd)/total*100);

  ${todayLeft>=0&&todayLeft<=100?`<div class="gantt-today" style="left:${todayLeft}%"></div>`:''}

 </div></div>

function mapApiProject(raw,i){
 let name=raw.name||raw.title||raw.projectName||`Untitled project ${i+1}`;
 let existing=projects.find(p=>p.name==name);
 return {
  id:existing?.id||raw.id||`PRJ-${String(100+i).padStart(3,'0')}`,
  name,
  prefix:existing?.prefix||raw.prefix||projectPrefix(name),
  owner:raw.owner||raw.projectOwner||existing?.owner||'Unassigned',
  team:raw.team||raw.department||existing?.team||'General',
  category:raw.category||existing?.category||'General',
  objective:raw.objective||raw.description||existing?.objective||'',
  description:raw.description||raw.objective||existing?.description||'',
  status:raw.status||existing?.status||'Active',
  priority:raw.priority||existing?.priority||'Medium',
  plannedStart:raw.plannedStart||raw.startDate||raw.start||existing?.plannedStart||iso(TODAY),
  plannedEnd:raw.plannedEnd||raw.endDate||raw.dueDate||raw.end||existing?.plannedEnd||iso(TODAY),
  actualStart:raw.actualStart||existing?.actualStart||'',
  actualEnd:raw.actualEnd||existing?.actualEnd||'',
  progress:Number(raw.progress??raw.percentComplete??existing?.progress??0),
  health:raw.health||existing?.health||'On Track',
  budget:Number(raw.budget??existing?.budget??0),
  actualCost:Number(raw.actualCost??existing?.actualCost??0),
  confidential:raw.confidential??existing?.confidential??false,
  color:existing?.color||['#397dcc','#8a5bd8','#159b82','#dc6b43'][i%4],
  milestones:existing?.milestones||[],
  dependencies:existing?.dependencies||[],
  links:existing?.links||[],
  createdAt:existing?.createdAt||iso(TODAY),
  updatedAt:iso(TODAY)
 };
}
async function syncProjectsFromApi(){
 let url=(document.getElementById('projectsApiUrl')?.value||'').trim();
 if(!url)return toast('Enter a JSON API endpoint first');
 saveProjectsApiUrl(true);
 let btn=document.getElementById('syncApiBtn');if(btn){btn.disabled=true;btn.innerHTML='<i class="ph ph-spinner"></i> Syncing…'}
 try{
  let res=await fetch(url);
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  let data=await res.json();
  let list=Array.isArray(data)?data:(Array.isArray(data?.projects)?data.projects:null);
  if(!list)throw new Error('Expected a JSON array, or an object with a "projects" array');
  let added=0,updated=0;
  list.forEach((raw,i)=>{
   let name=raw.name||raw.title||raw.projectName;
   if(!name)return;
   let existed=projects.some(p=>p.name==name);
   let mapped=mapApiProject(raw,i);
   if(existed){let idx=projects.findIndex(p=>p.name==name);projects[idx]=mapped;updated++}
   else{projects.push(mapped);added++}
  });
  localStorage.setItem('pcc_projects_api_last_sync',new Date().toISOString());
  logActivity(`Synced projects from API: ${added} added, ${updated} updated`,'Integrations');
  toast(`Synced from API: ${added} added, ${updated} updated`);
  render();
 }catch(err){
  toast('Sync failed: '+err.message);
  logActivity(`Project API sync failed: ${err.message}`,'Integrations');
 }
 renderUsers();
}

function updateItem(id,field,value){
 let t=items.find(x=>x.id==id);if(!t)return;if(!canEdit(t))return denied();
 let before=t[field];
 if(field=='status'){t.status=value;if(value=='Completed'){t.progress=100;t.actualCompletion=iso(TODAY)}else if(t.progress==100)t.progress=90;}
 else if(field=='progress'){t.progress=Number(value);if(t.progress>=100){t.progress=100;t.status='Completed';t.actualCompletion=iso(TODAY)}else if(t.status=='Completed')t.status='In Progress';}
 else t[field]=value;
 t.updatedAt=iso(TODAY);
 logActivity(`You updated ${field} on ${t.title}`+(before&&before!=value?` (${before} → ${value})`:''),t.title);
 if(field=='assignee')toast(`Notified ${value}: assigned to "${t.title}"`);
 if(field=='status'&&value=='Blocked')toast(`Alert sent to project manager: "${t.title}" is now Blocked`);
 render();
}
function openDetail(id){
 let t=items.find(x=>x.id==id);if(!t)return;
 let edit=canEdit(t),lock=edit?'':'disabled';
 veil.classList.add('open');
 overlay.innerHTML=`<aside class="drawer"><button class="close" onclick="closeOverlay()"><i class="ph ph-x"></i></button><p class="eyebrow">${t.id} · ${t.type}</p><h2>${esc(t.title)}</h2><p style="color:#777">${esc(t.linkedProjects.join(', '))} · Assigned to ${esc(t.assignee)}</p>
 ${!edit?'<div class="notice">Read-only access for this role. Comments remain available where permitted.</div>':''}
 <div class="formrow"><label>Status<select ${lock} onchange="updateItem('${id}','status',this.value)">${['Backlog','Planned','In Progress','Under Review','Blocked','Completed','On Hold'].map(x=>`<option ${x==t.status?'selected':''}>${x}</option>`)}</select></label><label>Priority<select ${lock} onchange="updateItem('${id}','priority',this.value)">${['Critical','High','Medium','Low'].map(x=>`<option ${x==t.priority?'selected':''}>${x}</option>`)}</select></label></div>
 <div class="formrow"><label>Assignee<select ${lock} onchange="updateItem('${id}','assignee',this.value)">${users.map(u=>`<option ${u[0]==t.assignee?'selected':''}>${esc(u[0])}</option>`)}</select></label><label>Due date<input ${lock} type="date" value="${t.dueDate}" onchange="updateItem('${id}','dueDate',this.value)"></label></div>
 <label>Progress: <b id="pv">${t.progress}%</b><input ${lock} type="range" min="0" max="100" value="${t.progress}" oninput="pv.textContent=this.value+'%'" onchange="updateItem('${id}','progress',this.value)"></label>
 <div class="detailblock"><h3>Description</h3><p>${esc(t.description)||'No description provided.'}</p></div>
 <div class="detailblock"><h3>Dependencies & blockers</h3>
 <p class="sub" style="font-size:10.5px;color:var(--muted);margin:0 0 6px">Depends on</p>${t.dependencies.map(d=>`<span class="chip" onclick="openDetail('${d}')">${esc(items.find(x=>x.id==d)?.title||d)}</span>`).join('')||'<span class="chip plain">None</span>'}
 <p class="sub" style="font-size:10.5px;color:var(--muted);margin:10px 0 6px">Blockers</p>${t.blockers.map((b,i)=>edit?`<span class="chip plain"><i class="ph-fill ph-warning-circle"></i> <span onclick="editBlocker('${id}',${i})" style="cursor:pointer" title="Click to edit">${esc(b)}</span> <i class="ph ph-x" onclick="removeBlocker('${id}',${i})" style="cursor:pointer" title="Remove"></i></span>`:`<span class="chip plain"><i class="ph-fill ph-warning-circle"></i> ${esc(b)}</span>`).join('')||'<span class="chip plain">None</span>'}
 ${edit?`<div style="margin-top:8px"><input id="newBlocker" placeholder="Add a blocker..." style="width:100%;height:34px;border:1px solid #ddd;border-radius:7px;padding:0 8px" onkeydown="if(event.key=='Enter'){addBlocker('${id}',this.value);this.value=''}"></div>`:''}</div>
 <div class="detailblock"><h3>Tags</h3><div class="tags">${t.tags.map(x=>`<span>${esc(x)}</span>`).join('')||'None'}</div></div>
 <div class="detailblock"><h3>Effort</h3><p>Estimated ${t.estEffort}h · Actual ${t.actualEffort}h</p></div>
 <div class="detailblock"><h3>Checklist</h3>${t.subtasks.map((s,i)=>`<div class="check" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:10px;min-width:0"><input type="checkbox" ${s.done?'checked':''} ${lock} onchange="toggleSubtask('${id}',${i})">${edit?`<span onclick="editSubtask('${id}',${i})" style="cursor:pointer" title="Click to edit">${esc(s.text)}</span>`:`<span>${esc(s.text)}</span>`}</span>${edit?`<i class="ph ph-x" onclick="removeSubtask('${id}',${i})" style="cursor:pointer;color:var(--n5)" title="Remove"></i>`:''}</div>`).join('')||'<p style="color:var(--muted);font-size:12px">No checklist items.</p>'}
 ${edit?`<input placeholder="Add checklist item and press Enter" style="width:100%;height:34px;border:1px solid #ddd;border-radius:7px;padding:0 8px;margin-top:6px" onkeydown="if(event.key=='Enter'){addSubtask('${id}',this.value);this.value=''}">`:''}</div>
 <div class="detailblock"><h3>Attachments & links</h3>${t.attachments.map((a,i)=>edit?`<span class="chip plain"><i class="ph ph-link"></i> <span onclick="editAttachment('${id}',${i})" style="cursor:pointer" title="Click to edit">${esc(a.label)}</span> <i class="ph ph-x" onclick="removeAttachment('${id}',${i})" style="cursor:pointer" title="Remove"></i></span>`:`<span class="chip plain"><i class="ph ph-link"></i> ${esc(a.label)}</span>`).join('')||'<p style="color:var(--muted);font-size:12px">None linked.</p>'}
 ${edit?`<input placeholder="Add a link label and press Enter" style="width:100%;height:34px;border:1px solid #ddd;border-radius:7px;padding:0 8px;margin-top:6px" onkeydown="if(event.key=='Enter'){addAttachment('${id}',this.value);this.value=''}">`:''}</div>
 <div class="detailblock"><h3>Discussion</h3>${t.comments.map(c=>`<div class="comment"><b>${esc(c.author)} · ${fmtShort(c.date)}</b><p>${linkify(c.text)}</p></div>${c.replies.map(r=>`<div class="comment reply"><b>${esc(r.author)} · ${fmtShort(r.date)}</b><p>${linkify(r.text)}</p></div>`).join('')}${edit?`<input placeholder="Reply..." style="width:100%;height:30px;border:1px solid #ddd;border-radius:7px;padding:0 8px;margin:4px 0 10px 22px;width:calc(100% - 22px)" onkeydown="if(event.key=='Enter'){addReply('${id}','${c.id}',this.value);this.value=''}">`:''}`).join('')}
 ${edit?`<input placeholder="Add a comment or @mention..." style="width:100%;height:36px;border:1px solid #ddd;border-radius:7px;padding:0 10px;margin-top:6px" onkeydown="if(event.key=='Enter'){addComment('${id}',this.value);this.value=''}">`:''}</div>
 <div class="detailblock"><h3>History</h3>${activity.filter(a=>a[2]==t.title).slice(0,8).map(a=>`<p style="font-size:12px;margin:4px 0">${esc(a[1])} · ${a[0]}</p>`).join('')||`<p style="font-size:12px;color:var(--muted)">Record created · ${fmtDate(t.createdAt)}</p>`}</div>
 </aside>`;
}
function addBlocker(id,text){if(!text.trim())return;let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();t.blockers.push(text.trim());if(t.status!='Blocked'){t.status='Blocked'}logActivity(`Blocker added: ${text.trim()}`,t.title);render();openDetail(id)}
function removeBlocker(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();let removed=t.blockers.splice(i,1)[0];logActivity(`Blocker removed: ${removed}`,t.title);render();openDetail(id)}
function editBlocker(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();let val=prompt('Edit blocker',t.blockers[i]);if(val==null||!val.trim())return;let before=t.blockers[i];t.blockers[i]=val.trim();logActivity(`Blocker updated: "${before}" → "${val.trim()}"`,t.title);render();openDetail(id)}
function toggleSubtask(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();t.subtasks[i].done=!t.subtasks[i].done;logActivity(`Checklist item ${t.subtasks[i].done?'completed':'reopened'}: ${t.subtasks[i].text}`,t.title);render();openDetail(id)}
function addSubtask(id,text){if(!text.trim())return;let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();t.subtasks.push({text:text.trim(),done:false});logActivity(`Checklist item added: ${text.trim()}`,t.title);render();openDetail(id)}
function removeSubtask(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();let removed=t.subtasks.splice(i,1)[0];logActivity(`Checklist item removed: ${removed.text}`,t.title);render();openDetail(id)}
function editSubtask(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();let val=prompt('Edit checklist item',t.subtasks[i].text);if(val==null||!val.trim())return;let before=t.subtasks[i].text;t.subtasks[i].text=val.trim();logActivity(`Checklist item renamed: "${before}" → "${val.trim()}"`,t.title);render();openDetail(id)}
function addAttachment(id,label){if(!label.trim())return;let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();t.attachments.push({label:label.trim(),url:'#'});logActivity(`Attachment added: ${label.trim()}`,t.title);render();openDetail(id)}
function removeAttachment(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();let removed=t.attachments.splice(i,1)[0];logActivity(`Attachment removed: ${removed.label}`,t.title);render();openDetail(id)}
function editAttachment(id,i){let t=items.find(x=>x.id==id);if(!canEdit(t))return denied();let val=prompt('Edit link label',t.attachments[i].label);if(val==null||!val.trim())return;let before=t.attachments[i].label;t.attachments[i].label=val.trim();logActivity(`Attachment renamed: "${before}" → "${val.trim()}"`,t.title);render();openDetail(id)}
function addComment(id,text){if(!text.trim())return;let t=items.find(x=>x.id==id);t.comments.push({id:uid('C'),author:currentUser,date:iso(TODAY),text:text.trim(),replies:[]});logActivity('You added a comment',t.title);let mentions=text.match(/@(\w+)/g);if(mentions)toast(`Notified ${mentions.join(', ')}`);render();openDetail(id)}
function addReply(id,commentId,text){if(!text.trim())return;let t=items.find(x=>x.id==id);let c=t.comments.find(x=>x.id==commentId);c.replies.push({author:currentUser,date:iso(TODAY),text:text.trim()});render();openDetail(id)}

/* ---------- CRUD: milestones / risks / decisions / changes ---------- */
function toggleMilestone(pid,mid){let p=projects.find(x=>x.id==pid);let m=p.milestones.find(x=>x.id==mid);m.done=!m.done;logActivity(`Milestone "${m.name}" marked ${m.done?'done':'pending'}`,p.name);render();window.__pdTab='milestones';renderWorkspace()}
function addMilestone(e,pid){e.preventDefault();let f=new FormData(e.target);let p=projects.find(x=>x.id==pid);p.milestones.push({id:uid('M'),name:f.get('name'),due:f.get('due'),done:false});logActivity(`Milestone "${f.get('name')}" added`,p.name);render();window.__pdTab='milestones';renderWorkspace()}
function removeMilestone(pid,mid){if(!['Administrator','Project Manager'].includes(currentRole))return denied();let p=projects.find(x=>x.id==pid);let idx=p.milestones.findIndex(x=>x.id==mid);if(idx<0)return;let removed=p.milestones.splice(idx,1)[0];logActivity(`Milestone removed: ${removed.name}`,p.name);render();window.__pdTab='milestones';renderWorkspace()}
function editMilestoneName(pid,mid){if(!['Administrator','Project Manager'].includes(currentRole))return denied();let p=projects.find(x=>x.id==pid);let m=p.milestones.find(x=>x.id==mid);let val=prompt('Edit milestone name',m.name);if(val==null||!val.trim())return;let before=m.name;m.name=val.trim();logActivity(`Milestone renamed: "${before}" → "${val.trim()}"`,p.name);render();window.__pdTab='milestones';renderWorkspace()}
function editMilestoneDate(pid,mid){if(!['Administrator','Project Manager'].includes(currentRole))return denied();let p=projects.find(x=>x.id==pid);let m=p.milestones.find(x=>x.id==mid);let val=prompt('Edit due date (YYYY-MM-DD)',m.due);if(val==null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(val.trim()))return toast('Enter a date as YYYY-MM-DD');let before=m.due;m.due=val.trim();logActivity(`Milestone "${m.name}" due date changed: ${fmtShort(before)} → ${fmtShort(val.trim())}`,p.name);render();window.__pdTab='milestones';renderWorkspace()}
function addRisk(e,pname){e.preventDefault();let f=new FormData(e.target);risks.unshift({id:uid('RSK'),project:pname,title:f.get('title'),severity:f.get('severity'),status:'Open',owner:f.get('owner'),date:iso(TODAY),notes:''});logActivity(`Risk logged: ${f.get('title')}`,pname);window.__pdTab='risks';renderWorkspace()}
function updateRiskStatus(id,status){let r=risks.find(x=>x.id==id);r.status=status;logActivity(`Risk "${r.title}" set to ${status}`,r.project);window.__pdTab='risks';renderWorkspace()}
function addDecision(e,pname){e.preventDefault();let f=new FormData(e.target);decisions.unshift({id:uid('DEC'),project:pname,title:f.get('title'),decision:f.get('decision'),date:iso(TODAY),owner:currentUser});logActivity(`Decision logged: ${f.get('title')}`,pname);window.__pdTab='decisions';renderWorkspace()}
function addChangeRequest(e,pname){e.preventDefault();let f=new FormData(e.target);changeRequests.unshift({id:uid('CR'),project:pname,title:f.get('title'),status:'Proposed',requestedBy:currentUser,date:iso(TODAY),impact:f.get('impact')||'TBD'});logActivity(`Change request submitted: ${f.get('title')}`,pname);window.__pdTab='changes';renderWorkspace()}
function updateChangeStatus(id,status){let c=changeRequests.find(x=>x.id==id);c.status=status;logActivity(`Change request "${c.title}" set to ${status}`,c.project);window.__pdTab='changes';renderWorkspace()}

/* ---------- CRUD: projects ---------- */
function openAddProject(){
 if(currentRole!='Administrator')return denied();
 veil.classList.add('open');
 overlay.innerHTML=`<div class="modal"><button class="close" onclick="closeOverlay()"><i class="ph ph-x"></i></button><h2>Create project</h2><form class="form" onsubmit="addProject(event)">
 <label>Project name<input name="name" required autofocus placeholder="e.g. Digital Commerce Upgrade"></label>
 <label>Objective<input name="objective" required placeholder="What should this project achieve?"></label>
 <div class="formrow"><label>Project owner<input name="owner" required value="Karen Quah"></label><label>Team<input name="team" required placeholder="Digital Product"></label></div>
 <div class="formrow"><label>Priority<select name="priority"><option>High</option><option>Critical</option><option>Medium</option><option>Low</option></select></label><label>Budget (RM)<input name="budget" type="number" value="0"></label></div>
 <div class="formrow"><label>Start date<input name="start" type="date" required></label><label>End date<input name="due" type="date" required></label></div>
 <label class="check" style="margin-top:14px"><input type="checkbox" name="confidential"> Confidential project (hidden from Viewer role)</label>
 <div class="actions"><button type="button" class="btn light" onclick="closeOverlay()">Cancel</button><button class="btn">Create project</button></div></form></div>`;
}
function addProject(e){
 e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();
 projects.push({id:`PRJ-${String(32+projects.length).padStart(3,'0')}`,name,owner:f.get('owner'),team:f.get('team'),category:'General',objective:f.get('objective'),description:f.get('objective'),status:'Active',priority:f.get('priority'),plannedStart:f.get('start'),plannedEnd:f.get('due'),actualStart:f.get('start'),actualEnd:'',progress:0,health:'On Track',budget:Number(f.get('budget'))||0,actualCost:0,confidential:f.get('confidential')=='on',color:['#397dcc','#8a5bd8','#159b82','#dc6b43'][projects.length%4],milestones:[],dependencies:[],links:[],createdAt:iso(TODAY),updatedAt:iso(TODAY)});
 logActivity(`Karen created project ${name}`,'Projects');closeOverlay();render();
}
function removeProject(id){
 if(currentRole!='Administrator')return denied();let p=projects.find(x=>x.id==id);if(!p)return;
 veil.classList.add('open');
 overlay.innerHTML=`<div class="modal"><button class="close" onclick="closeOverlay()"><i class="ph ph-x"></i></button><p class="eyebrow">REMOVE PROJECT</p><h2>Remove ${esc(p.name)}?</h2><p style="color:#747b88;line-height:1.55">This will remove the project and its project-specific work items. Shared features will remain available.</p><div class="actions"><button class="btn light" onclick="closeOverlay()">Cancel</button><button class="btn danger" onclick="confirmRemoveProject('${id}')">Remove project</button></div></div>`;
}
function confirmRemoveProject(id){
 let p=projects.find(x=>x.id==id);if(!p)return closeOverlay();
 items=items.filter(t=>{if(t.type=='Shared'){t.linkedProjects=t.linkedProjects.filter(n=>n!=p.name);return true}return !t.linkedProjects.includes(p.name)});
 projects.splice(projects.indexOf(p),1);
 logActivity(`Karen removed project ${p.name}`,'Projects');closeOverlay();render();
}

/* ---------- CRUD: users (real accounts via Supabase Auth) ---------- */
function inviteUser(){
 if(currentRole!='Administrator')return denied();
 veil.classList.add('open');
 overlay.innerHTML=`<div class="modal"><button class="close" onclick="closeOverlay()"><i class="ph ph-x"></i></button><h2>Invite a teammate</h2><p style="color:var(--n5);font-size:13px;line-height:1.6">There's no automated email invite yet. Share this page's link with them and have them create an account from the sign-in screen. New accounts start as <b>Viewer</b> — once they've signed up, promote their role in the table below.</p><div class="actions"><button class="btn" onclick="closeOverlay()">Got it</button></div></div>`;
}
async function loadRealUsersTable(){
 let host=document.getElementById('userRows');if(!host)return;
 if(!sb){host.innerHTML='<tr><td colspan="5" class="empty">Authentication service unavailable — check your connection and reload.</td></tr>';return}
 let{data:profiles,error}=await sb.from('profiles').select('*').order('created_at',{ascending:true});
 if(error){host.innerHTML=`<tr><td colspan="5" class="empty">Couldn't load accounts: ${esc(error.message)}</td></tr>`;return}
 host.innerHTML=(profiles||[]).map(p=>`<tr><td><span class="avatar">${initials(p.full_name||p.id)}</span> &nbsp;<b>${esc(p.full_name||'(no name set)')}</b>${p.id==authUser?.id?' <span class="role-chip">YOU</span>':''}</td><td>${esc(p.team||'—')}</td><td>${currentRole=='Administrator'?`<select onchange="changeProfileRole('${p.id}',this.value)">${['Administrator','Project Manager','Contributor','Viewer'].map(r=>`<option ${r==p.role?'selected':''}>${r}</option>`)}</select>`:`<span class="role-chip">${esc(p.role)}</span>`}</td><td>—</td><td><span class="health on-track">Active</span>${currentRole=='Administrator'?` &nbsp;<button class="icon-action" onclick="editProfileName('${p.id}')">Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No accounts yet.</td></tr>';
}
async function changeProfileRole(id,role){
 if(currentRole!='Administrator')return denied();
 let{error}=await sb.from('profiles').update({role}).eq('id',id);
 if(error)return toast('Failed to update role: '+error.message);
 logActivity(`Changed a teammate's role to ${role}`,'Users & access');toast('Role updated');loadRealUsersTable();
}
async function editProfileName(id){
 if(currentRole!='Administrator'&&id!=authUser?.id)return denied();
 let{data:p}=await sb.from('profiles').select('*').eq('id',id).single();
 if(!p)return;
 veil.classList.add('open');
 overlay.innerHTML=`<div class="modal"><button class="close" onclick="closeOverlay()"><i class="ph ph-x"></i></button><h2>Edit account</h2><form class="form" onsubmit="saveProfileName(event,'${id}')"><label>Full name<input name="name" required value="${esc(p.full_name||'')}"></label><label>Team<input name="team" value="${esc(p.team||'')}"></label><div class="actions"><button type="button" class="btn light" onclick="closeOverlay()">Cancel</button><button class="btn">Save changes</button></div></form></div>`;
}
async function saveProfileName(e,id){
 e.preventDefault();let f=new FormData(e.target);
 let{error}=await sb.from('profiles').update({full_name:f.get('name'),team:f.get('team')}).eq('id',id);
 if(error)return toast('Failed to save: '+error.message);
 if(id==authUser?.id){currentUser=f.get('name');document.getElementById('profileName').textContent=currentUser;document.getElementById('profileAvatar').textContent=initials(currentUser)}
 logActivity('Updated an account','Users & access');closeOverlay();loadRealUsersTable();
}

function closeOverlay(){veil.classList.remove('open');overlay.innerHTML=''}
function render(){syncProgress();setAccessVisibility();renderCurrentPage()}
buildPages();checkAuthOnLoad();
</script>
</body></html>
